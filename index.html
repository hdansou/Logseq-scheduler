<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #111;
      }
      body {
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
      }
      #app {
        width: 100%;
        max-width: 760px;
        padding: 40px 16px;
        box-sizing: border-box;
      }
      .scheduler-panel {
        background: #ffffff;
        color: #111;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .scheduler-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .scheduler-header h2 {
        margin: 0;
        font-size: 1.35em;
      }
      .scheduler-close {
        padding: 6px 14px;
        border: 1px solid #d0d0d0;
        background: #f5f5f5;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
      }
      .scheduler-close:hover { background: #eaeaea; }
      .scheduler-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
        background: #f7f7f8;
        border: 1px solid #e5e5e8;
        border-radius: 6px;
        margin-bottom: 20px;
      }
      .scheduler-form h3 { margin: 0 0 4px; font-size: 1em; }
      .scheduler-form label {
        display: flex;
        flex-direction: column;
        font-size: 0.85em;
        color: #444;
        gap: 4px;
      }
      .scheduler-form input {
        padding: 8px 10px;
        font-size: 0.95em;
        border: 1px solid #d0d0d5;
        border-radius: 4px;
        background: #ffffff;
        color: #111;
        outline: none;
      }
      .scheduler-form input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }
      .scheduler-form small {
        color: #666;
        font-size: 0.8em;
      }
      .scheduler-form small code {
        background: #ececef;
        padding: 1px 6px;
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .scheduler-form small code.error { color: #c1292e; background: #fdecea; }
      #add-schedule {
        padding: 10px 16px;
        margin-top: 6px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95em;
        font-weight: 500;
      }
      #add-schedule:hover { background: #1d4ed8; }
      .scheduler-form-error {
        padding: 8px 12px;
        background: #fdecea;
        border: 1px solid #f5c2c0;
        color: #b42318;
        border-radius: 4px;
        font-size: 0.85em;
      }
      .scheduler-list h3 { margin: 0 0 10px; font-size: 1em; }
      .scheduler-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 12px 14px;
        border: 1px solid #e5e5e8;
        border-radius: 6px;
        margin-bottom: 8px;
        background: #ffffff;
      }
      .scheduler-row-main { flex: 1; }
      .scheduler-row-main strong { font-size: 0.95em; }
      .scheduler-row-sub {
        font-size: 0.8em;
        color: #666;
        margin-top: 4px;
      }
      .scheduler-row-sub code {
        background: #f0f0f3;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .scheduler-row-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        font-size: 0.8em;
      }
      .scheduler-row-actions button {
        padding: 4px 10px;
        border: 1px solid #e0a0a0;
        background: #fff5f5;
        color: #b42318;
        border-radius: 4px;
        cursor: pointer;
      }
      .scheduler-row-actions button:hover { background: #ffe5e5; }
      .scheduler-empty {
        color: #888;
        font-style: italic;
        padding: 12px;
        text-align: center;
        background: #fafafa;
        border: 1px dashed #ddd;
        border-radius: 6px;
      }

      @media (prefers-color-scheme: dark) {
        html, body { color: #e5e7eb; }
        .scheduler-panel { background: #1f2024; color: #e5e7eb; }
        .scheduler-header h2 { color: #f3f4f6; }
        .scheduler-close { background: #2a2c32; border-color: #3a3d45; color: #e5e7eb; }
        .scheduler-close:hover { background: #33363d; }
        .scheduler-form { background: #17181c; border-color: #2c2e36; }
        .scheduler-form label { color: #b8bcc4; }
        .scheduler-form input { background: #0f1013; border-color: #2c2e36; color: #e5e7eb; }
        .scheduler-form small { color: #9ca3af; }
        .scheduler-form small code { background: #2a2c32; color: #e5e7eb; }
        .scheduler-row { background: #17181c; border-color: #2c2e36; }
        .scheduler-row-sub { color: #9ca3af; }
        .scheduler-row-sub code { background: #2a2c32; color: #e5e7eb; }
        .scheduler-row-actions button { background: #3a1f1f; border-color: #7a2e2e; color: #fca5a5; }
        .scheduler-row-actions button:hover { background: #4a2525; }
        .scheduler-empty { background: #17181c; border-color: #2c2e36; color: #9ca3af; }
        .scheduler-form-error { background: #3a1f1f; border-color: #7a2e2e; color: #fca5a5; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
